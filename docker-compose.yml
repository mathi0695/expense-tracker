version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: expense-tracker-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: expense-tracker
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - expense-tracker-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/expense-tracker --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Backend API
  api:
    build:
      context: ./expense-tracker-api
      dockerfile: Dockerfile
    container_name: expense-tracker-api
    restart: unless-stopped
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=development
      - PORT=3008
      - MONGODB_URI=mongodb://mongodb:27017/expense-tracker
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - JWT_EXPIRES_IN=7d
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_MODEL=${AI_MODEL:-gpt-4}
      - CORS_ORIGIN=http://localhost:5174
    volumes:
      - ./expense-tracker-api:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - expense-tracker-network
    # Temporarily disable health check to allow container to start
    # healthcheck:
    #   disable: true

  # Frontend Web Application
  web:
    build:
      context: ./expense-tracker-web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3008/api
    container_name: expense-tracker-web
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      - VITE_API_URL=http://localhost:3008/api
    volumes:
      - ./expense-tracker-web:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - expense-tracker-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5174/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  expense-tracker-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

